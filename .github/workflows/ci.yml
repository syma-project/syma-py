name: syma-py CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 134217728

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # syma-py depends on the sibling `syma` crate via `../syma`.
      - uses: actions/checkout@v4
        with:
          path: syma-py
      - uses: actions/checkout@v4
        with:
          repository: syma-project/syma
          path: syma
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev clang
      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-py-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-py-
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create venv + install tools
        working-directory: syma-py
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip maturin pytest
      - name: Build extension
        working-directory: syma-py
        run: |
          . .venv/bin/activate
          maturin develop
      - name: Pytest
        working-directory: syma-py
        run: |
          . .venv/bin/activate
          python -m pytest -v --tb=short
